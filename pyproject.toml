[project]
name = "desktop-memer"
version = "0.1.0"
description = "Collect OSS activity, turn it into a meme, post to Mattermost"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "launchpadlib>=1.11",
]

[project.scripts]
memer = "memer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memer"]
